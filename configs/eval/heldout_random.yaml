experiment:
  name: heldout_random_eval
  seed: 42
  output_dir: runs/heldout_random_eval

metadrive:
  env_class: metadrive.envs.MetaDriveEnv
  config:
    start_seed: 5000
    num_scenarios: 200
    traffic_density: 0.1
    random_traffic: true
    use_render: false
    horizon: 1000
    log_level: 50
    crash_vehicle_done: false
    crash_object_done: false
    out_of_road_done: false

algorithm:
  checkpoint_path:

cost_function:
  _target_: fasb.plugins.cost.DefaultDrivingCost

eval:
  scenario_set: heldout_random
  n_episodes: 200
  deterministic: true
