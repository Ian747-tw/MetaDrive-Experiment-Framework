experiment:
  name: fasb_ppo
  mode: fasb_ppo
  seed: 42
  output_dir: runs/fasb_ppo
  save_resolved_config: true
mode: fasb_ppo
metadrive:
  env_class: metadrive.envs.MetaDriveEnv
  config:
    start_seed: 1000
    num_scenarios: 200
    traffic_density: 0.1
    random_traffic: true
    use_render: false
    horizon: 1000
    log_level: 50
vec_env:
  type: dummy
  n_envs: 1
  start_method: forkserver
algorithm:
  backend: sb3
  name: PPO
  policy: MlpPolicy
  checkpoint_path:
  params:
    learning_rate: 0.0001
    n_steps: 128
    batch_size: 64
    gamma: 0.99
    verbose: 0
training:
  total_timesteps: 1000
  save_every_steps: 500
  eval_every_steps: 1000
  deterministic_eval: true
failure_buffer:
  path: runs/base_explore/buffers/failure_buffer.jsonl
  max_size: 1000
cost_function:
  _target_: fasb.plugins.cost.DefaultDrivingCost
failure_scorer:
  _target_: fasb.plugins.failure_scorer.DefaultFailureScorer
failure_classifier:
  _target_: fasb.plugins.failure_classifier.DefaultFailureClassifier
safety_budget:
  _target_: fasb.plugins.safety_budget.AdaptiveSafetyBudget
  d_min: 0.02
  d_max: 0.10
  timeout_budget: 0.07
penalty_scheduler:
  _target_: fasb.plugins.penalty_scheduler.RiskPenaltyScheduler
  lambda_min: 0.1
  lambda_max: 5.0
sampler:
  _target_: fasb.plugins.sampler.MixedFailureSampler
  start_seed: 1000
  num_scenarios: 200
  failure_ratio: 0.6
  alpha: 0.7
  max_too_hard_ratio: 0.15
error_policy:
  plugin_error: fail_fast
  validation_error: fail_fast
  allow_custom_imports: true
  max_fallbacks: 0
eval:
  n_episodes: 20
  scenario_sets: [heldout_random, discovered_failures, heldout_failure_modes]
