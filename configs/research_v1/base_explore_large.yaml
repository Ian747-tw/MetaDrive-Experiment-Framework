experiment:
  name: base_explore_large_research_v1
  seed: 42
  output_dir: runs/research_v1/base_explore_large
mode: explore
metadrive:
  env_class: metadrive.envs.MetaDriveEnv
  config:
    start_seed: 0
    num_scenarios: 3000
    traffic_density: 0.1
    random_traffic: true
    use_render: false
    horizon: 500
    log_level: 50
    crash_vehicle_done: false
    crash_object_done: false
    out_of_road_done: false
algorithm:
  backend: sb3
  name: PPO
  policy: MlpPolicy
  checkpoint_path: runs/research_v1/base_pretrain_s42/checkpoints/final.zip
  params:
    device: cpu
failure_buffer:
  max_size: 5000
cost_function:
  _target_: fasb.plugins.cost.DefaultDrivingCost
eval:
  n_episodes: 3000
